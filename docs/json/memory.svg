    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .grid{stroke:#383835}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="449" rx="10"/><text class="t" x="24" y="34">Memory per key: built-in as % of valkey-json</text><text class="s" x="24" y="56">Lower is better. Same server core on both sides, jemalloc.</text><line class="grid" x1="300.0" y1="84" x2="300.0" y2="362"/><text class="s" x="300.0" y="378" text-anchor="middle">0%</text><line class="grid" x1="427.27272727272725" y1="84" x2="427.27272727272725" y2="362"/><text class="s" x="427.27272727272725" y="378" text-anchor="middle">25%</text><line class="grid" x1="554.5454545454545" y1="84" x2="554.5454545454545" y2="362"/><text class="s" x="554.5454545454545" y="378" text-anchor="middle">50%</text><line class="grid" x1="681.8181818181818" y1="84" x2="681.8181818181818" y2="362"/><text class="s" x="681.8181818181818" y="378" text-anchor="middle">75%</text><line class="grid" x1="809.090909090909" y1="84" x2="809.090909090909" y2="362"/><text class="s" x="809.090909090909" y="378" text-anchor="middle">100%</text><text class="s" x="290" y="110" text-anchor="end">Object with 100 members</text><rect class="bar" x="300" y="97" height="20" width="56.0" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;56.0;56.0;0" keyTimes="0;0.022;0.102;0.96;1"/></rect><text class="m" x="362.0" y="111">11%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.082;0.112;0.96;1"/></text><text class="s" x="290" y="140" text-anchor="end">1,536 full-precision doubles</text><rect class="bar" x="300" y="127" height="20" width="117.0909090909091" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;117.0909090909091;117.0909090909091;0" keyTimes="0;0.039;0.119;0.96;1"/></rect><text class="m" x="423.0909090909091" y="141">23%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.099;0.129;0.96;1"/></text><text class="s" x="290" y="170" text-anchor="end">100,000 integers</text><rect class="bar" x="300" y="157" height="20" width="127.27272727272727" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;127.27272727272727;127.27272727272727;0" keyTimes="0;0.056;0.136;0.96;1"/></rect><text class="m" x="433.27272727272725" y="171">25%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.116;0.146;0.96;1"/></text><text class="s" x="290" y="200" text-anchor="end">1,536 six-decimal values</text><rect class="bar" x="300" y="187" height="20" width="147.63636363636363" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;147.63636363636363;147.63636363636363;0" keyTimes="0;0.072;0.152;0.96;1"/></rect><text class="m" x="453.6363636363636" y="201">29%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.132;0.162;0.96;1"/></text><text class="s" x="290" y="230" text-anchor="end">100,000-record array</text><rect class="bar" x="300" y="217" height="20" width="168.0" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;168.0;168.0;0" keyTimes="0;0.089;0.169;0.96;1"/></rect><text class="m" x="474.0" y="231">33%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.149;0.179;0.96;1"/></text><text class="s" x="290" y="260" text-anchor="end">Order record (747 B)</text><rect class="bar" x="300" y="247" height="20" width="208.72727272727272" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;208.72727272727272;208.72727272727272;0" keyTimes="0;0.106;0.186;0.96;1"/></rect><text class="m" x="514.7272727272727" y="261">41%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.166;0.196;0.96;1"/></text><text class="s" x="290" y="290" text-anchor="end">Session record (307 B)</text><rect class="bar" x="300" y="277" height="20" width="249.45454545454547" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;249.45454545454547;249.45454545454547;0" keyTimes="0;0.122;0.202;0.96;1"/></rect><text class="m" x="555.4545454545455" y="291">49%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.182;0.212;0.96;1"/></text><text class="s" x="290" y="320" text-anchor="end">Profile record (596 B)</text><rect class="bar" x="300" y="307" height="20" width="249.45454545454547" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;249.45454545454547;249.45454545454547;0" keyTimes="0;0.139;0.219;0.96;1"/></rect><text class="m" x="555.4545454545455" y="321">49%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.199;0.229;0.96;1"/></text><text class="s" x="290" y="350" text-anchor="end">10,000 short strings</text><rect class="bar" x="300" y="337" height="20" width="509.09090909090907" rx="4"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;509.09090909090907;509.09090909090907;0" keyTimes="0;0.156;0.236;0.96;1"/></rect><text class="m" x="815.090909090909" y="351">100%<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.216;0.246;0.96;1"/></text><line class="ref" x1="809.090909090909" y1="78" x2="809.090909090909" y2="362"/><text class="refl" x="803.090909090909" y="76" text-anchor="end">valkey-json = 100%</text><text class="s" x="24" y="408">Eight real-world JSON files: 6% to 67%. The same on Graviton and x86-64.</text></svg>