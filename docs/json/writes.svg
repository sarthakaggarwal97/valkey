<rect class="bg" x="0.5" y="0.5" width="919" height="429" rx="10"/><text class="t" x="24" y="34">Three ways a write changes a packed block</text><text class="h" x="24" y="70">In place: the new value is the same size</text><text class="s" x="24" y="88">a bool, a number that fits its width, a same-length string</text><text class="s" x="600" y="122">NUMINCRBY $.age 1: 0.64 µs (valkey-json 1.69)</text><rect class="hdr" x="24" y="102" width="58" height="30" rx="3"/><text class="m" x="53.0" y="121.0" text-anchor="middle">obj 19</text><rect class="key" x="84" y="102" width="20" height="30" rx="3"/><text class="m" x="94.0" y="121.0" text-anchor="middle">#1</text><rect class="cell" x="106" y="102" width="80" height="30" rx="3"/><text class="m" x="146.0" y="121.0" text-anchor="middle">Ada</text><rect class="key" x="188" y="102" width="20" height="30" rx="3"/><text class="m" x="198.0" y="121.0" text-anchor="middle">#2</text><rect class="cell" x="210" y="102" width="38" height="30" rx="3"/><text class="m" x="229" y="121" text-anchor="middle">36<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.15;0.2;0.95;1"/></text><text class="m" x="229" y="121" text-anchor="middle" opacity="0">37<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.15;0.2;0.95;1"/></text><rect x="208" y="100" width="42" height="34" rx="4" fill="none" stroke="#eb6834" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.14;0.2;0.3;1"/></rect><rect class="key" x="250" y="102" width="20" height="30" rx="3"/><text class="m" x="260.0" y="121.0" text-anchor="middle">#3</text><rect class="hdr" x="272" y="102" width="58" height="30" rx="3"/><text class="m" x="301.0" y="121.0" text-anchor="middle">arr</text><rect class="cell" x="332" y="102" width="38" height="30" rx="3"/><text class="m" x="351.0" y="121.0" text-anchor="middle">x</text><rect class="cell" x="372" y="102" width="38" height="30" rx="3"/><text class="m" x="391.0" y="121.0" text-anchor="middle">y</text><text class="h" x="24" y="190">Splice: the size changes and the block still fits</text><text class="s" x="24" y="208">move the tail, patch the size of every enclosing container</text><text class="s" x="600" y="242">SET $.name "Adaline": 0.85 µs (valkey-json 1.55)</text><rect class="hdr" x="24" y="222" width="58" height="30" rx="3"/><text class="m" x="53" y="241" text-anchor="middle" opacity="1">obj 19<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.5;0.55;0.95;1"/></text><text class="m" x="53" y="241" text-anchor="middle" opacity="0">obj 23<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1"/></text><rect class="key" x="84" y="222" width="20" height="30" rx="3"/><text class="m" x="94.0" y="241.0" text-anchor="middle">#1</text><rect class="cell" x="106" y="222" width="80" height="30" rx="3"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="80;80;160;160;80" keyTimes="0;0.4;0.5;0.95;1"/></rect><text class="m" x="146" y="241" text-anchor="middle">Ada<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1"/></text><text class="m" x="186" y="241" text-anchor="middle" opacity="0">Adaline<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1"/></text><g><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="0 0;0 0;80 0;80 0;0 0" keyTimes="0;0.4;0.5;0.95;1"/><rect class="key" x="188" y="222" width="20" height="30" rx="3"/><text class="m" x="198.0" y="241.0" text-anchor="middle">#2</text><rect class="cell" x="210" y="222" width="38" height="30" rx="3"/><text class="m" x="229.0" y="241.0" text-anchor="middle">36</text><rect class="key" x="250" y="222" wid