<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 578" width="920" height="578" role="img" aria-label="In place, splice and re-emit writes on a packed block">
<style>
  .bg{fill:#fcfcfb;stroke:#e4e3df}
  .t{fill:#0b0b0b;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}
  .h{fill:#0b0b0b;font:600 14px system-ui,-apple-system,Segoe UI,sans-serif}
  .s{fill:#52514e;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
  .m{fill:#0b0b0b;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .mw{fill:#ffffff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cell{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
  .key{fill:#fde3d6;stroke:#eb6834;stroke-width:1}
  .hdr{fill:#e9e8e4;stroke:#8a8984;stroke-width:1}
  .word{fill:#2a78d6;stroke:#1c5cab;stroke-width:1}
  .box{fill:none;stroke:#c9c8c2;stroke-width:1;stroke-dasharray:4 3}
  .ln{stroke:#8a8984;stroke-width:1.5;fill:none}
  .kl{stroke:#eb6834;stroke-width:1.5;fill:none}
  .bar{fill:#2a78d6}
  .ref{stroke:#eb6834;stroke-width:2;stroke-dasharray:5 4}
  .refl{fill:#c2410c;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif}
  .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .xs{fill:#6b6a66;font:11px system-ui,-apple-system,Segoe UI,sans-serif}
  .n{fill:#0b0b0b;font:12px system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
  .ms{fill:#0b0b0b;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .br{stroke:#8a8984;stroke-width:1;fill:none}
  .grid{stroke:#e4e3df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .xs{fill:#6b6a66;font:11px system-ui,-apple-system,Segoe UI,sans-serif}
  .n{fill:#0b0b0b;font:12px system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
  .ms{fill:#0b0b0b;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .br{stroke:#8a8984;stroke-width:1;fill:none}
  .grid{stroke:#383835}
    .xs{fill:#a3a29b}
    .n,.ms{fill:#f0efec}
    .br{stroke:#a3a29b}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="577" rx="10"/><text class="t" x="24" y="34" text-anchor="start">Three ways a write changes a packed block</text><text class="s" x="24" y="54" text-anchor="start">The engine uses the cheapest one that works. Blocks are drawn to scale, 20 px per byte.</text><circle class="word" cx="33" cy="87" r="9"/><text class="mw" x="33" y="91" text-anchor="middle">1</text><text class="h" x="50" y="92" text-anchor="start">In place: the new value is the same size</text><text class="m" x="50" y="112" text-anchor="start">JSON.NUMINCRBY doc $.age 1</text><text class="s" x="896" y="112" text-anchor="end">0.52 µs, valkey-json 1.57 µs</text><text class="s" x="24" y="147" text-anchor="start">Before</text><rect class="hdr" x="91" y="128" width="58" height="28" rx="3"/><text class="m" x="120.0" y="146.0" text-anchor="middle">obj 16</text><rect class="key" x="151" y="128" width="18" height="28" rx="3"/><text class="ms" x="160.0" y="146.0" text-anchor="middle">#1</text><rect class="cell" x="171" y="128" width="78" height="28" rx="3"/><text class="m" x="210.0" y="146.0" text-anchor="middle">Ada</text><rect class="key" x="251" y="128" width="18" height="28" rx="3"/><text class="ms" x="260.0" y="146.0" text-anchor="middle">#2</text><rect class="cell" x="271" y="128" width="38" height="28" rx="3"/><text class="m" x="290.0" y="146.0" text-anchor="middle">36</text><rect class="key" x="311" y="128" width="18" height="28" rx="3"/><text class="ms" x="320.0" y="146.0" text-anchor="middle">#3</text><rect class="hdr" x="331" y="128" width="58" height="28" rx="3"/><text class="m" x="360.0" y="146.0" text-anchor="middle">arr 4</text><rect class="cell" x="391" y="128" width="38" height="28" rx="3"/><text class="m" x="410.0" y="146.0" text-anchor="middle">x</text><rect class="cell" x="431" y="128" width="38" height="28" rx="3"/><text class="m" x="450.0" y="146.0" text-anchor="middle">y</text><g><text class="s" x="24" y="185" text-anchor="start">After</text><rect class="hdr" x="91" y="166" width="58" height="28" rx="3"/><text class="m" x="120.0" y="184.0" text-anchor="middle">obj 16</text><rect class="key" x="151" y="166" width="18" height="28" rx="3"/><text class="ms" x="160.0" y="184.0" text-anchor="middle">#1</text><rect class="cell" x="171" y="166" width="78" height="28" rx="3"/><text class="m" x="210.0" y="184.0" text-anchor="middle">Ada</text><rect class="key" x="251" y="166" width="18" height="28" rx="3"/><text class="ms" x="260.0" y="184.0" text-anchor="middle">#2</text><rect class="cell" x="271" y="166" width="38" height="28" rx="3"/><text class="m" x="290.0" y="184.0" text-anchor="middle">37</text><rect class="hi" x="269" y="164" width="42" height="32" rx="4"/><rect class="key" x="311" y="166" width="18" height="28" rx="3"/><text class="ms" x="320.0" y="184.0" text-anchor="middle">#3</text><rect class="hdr" x="331" y="166" width="58" height="28" rx="3"/><text class="m" x="360.0" y="184.0" text-anchor="middle">arr 4</text><rect class="cell" x="391" y="166" width="38" height="28" rx="3"/><text class="m" x="410.0" y="184.0" text-anchor="middle">x</text><rect class="cell" x="431" y="166" width="38" height="28" rx="3"/><text class="m" x="450.0" y="184.0" text-anchor="middle">y</text><text class="s" x="490" y="185" text-anchor="start">One byte changes. Nothing moves.</text></g><circle class="word" cx="33" cy="227" r="9"/><text class="mw" x="33" y="231" text-anchor="middle">2</text><text class="h" x="50" y="232" text-anchor="start">Splice: the size changes, but the block still fits</text><text class="m" x="50" y="252" text-anchor="start">JSON.SET doc $.name '"Adaline"'</text><text class="s" x="896" y="252" text-anchor="end">0.72 µs, valkey-json 1.44 µs</text><text class="s" x="24" y="287" text-anchor="start">Before</text><rect class="hdr" x="91" y="268" width="58" height="28" rx="3"/><text class="m" x="120.0" y="286.0" text-anchor="middle">obj 16</text><rect class="key" x="151" y="268" width="18" height="28" rx="3"/><text class="ms" x="160.0" y="286.0" text-anchor="middle">#1</text><rect class="cell" x="171" y="268" width="78" height="28" rx="3"/><text class="m" x="210.0" y="286.0" text-anchor="middle">Ada</text><rect class="key" x="251" y="268" width="18" height="28" rx="3"/><text class="ms" x="260.0" y="286.0" text-anchor="middle">#2</text><rect class="cell" x="271" y="268" width="38" height="28" rx="3"/><text class="m" x="290.0" y="286.0" text-anchor="middle">36</text><rect class="key" x="311" y="268" width="18" height="28" rx="3"/><text class="ms" x="320.0" y="286.0" text-anchor="middle">#3</text><rect class="hdr" x="331" y="268" width="58" height="28" rx="3"/><text class="m" x="360.0" y="286.0" text-anchor="middle">arr 4</text><rect class="cell" x="391" y="268" width="38" height="28" rx="3"/><text class="m" x="410.0" y="286.0" text-anchor="middle">x</text><rect class="cell" x="431" y="268" width="38" height="28" rx="3"/><text class="m" x="450.0" y="286.0" text-anchor="middle">y</text><g><text class="s" x="24" y="325" text-anchor="start">After</text><rect class="hdr" x="91" y="306" width="58" height="28" rx="3"/><text class="m" x="120.0" y="324.0" text-anchor="middle">obj 20</text><rect class="hi" x="89" y="304" width="62" height="32" rx="4"/><rect class="key" x="151" y="306" width="18" height="28" rx="3"/><text class="ms" x="160.0" y="324.0" text-anchor="middle">#1</text><rect class="cell" x="171" y="306" width="158" height="28" rx="3"/><text class="m" x="250.0" y="324.0" text-anchor="middle">Adaline</text><rect class="hi" x="169" y="304" width="162" height="32" rx="4"/><rect class="key" x="331" y="306" width="18" height="28" rx="3"/><text class="ms" x="340.0" y="324.0" text-anchor="middle">#2</text><rect class="cell" x="351" y="306" width="38" height="28" rx="3"/><text class="m" x="370.0" y="324.0" text-anchor="middle">36</text><rect class="key" x="391" y="306" width="18" height="28" rx="3"/><text class="ms" x="400.0" y="324.0" text-anchor="middle">#3</text><rect class="hdr" x="411" y="306" width="58" height="28" rx="3"/><text class="m" x="440.0" y="324.0" text-anchor="middle">arr 4</text><rect class="cell" x="471" y="306" width="38" height="28" rx="3"/><text class="m" x="490.0" y="324.0" text-anchor="middle">x</text><rect class="cell" x="511" y="306" width="38" height="28" rx="3"/><text class="m" x="530.0" y="324.0" text-anchor="middle">y</text><path class="br" d="M331,344 L331,340 L549,340 L549,344"/><text class="xs" x="440.0" y="358" text-anchor="middle">moved 4 bytes right by one memmove</text><text class="s" x="570" y="325" text-anchor="start">The object's size goes from 16 to 20.</text></g><circle class="word" cx="33" cy="395" r="9"/><text class="mw" x="33" y="399" text-anchor="middle">3</text><text class="h" x="50" y="400" text-anchor="start">Re-emit: the block would outgrow its limits</text><text class="s" x="50" y="420" text-anchor="start">Rare. The block goes back through a tape and the emitter writes it out again.</text><text class="xs" x="24" y="444" text-anchor="start">Full block, 4,096 bytes, not to scale</text><rect class="key" x="24" y="452" width="15" height="28" rx="3"/><rect class="cell" x="41" y="452" width="15" height="28" rx="3"/><rect class="cell" x="58" y="452" width="15" height="28" rx="3"/><rect class="key" x="75" y="452" width="15" height="28" rx="3"/><rect class="cell" x="92" y="452" width="15" height="28" rx="3"/><rect class="cell" x="109" y="452" width="15" height="28" rx="3"/><rect class="key" x="126" y="452" width="15" height="28" rx="3"/><rect class="cell" x="143" y="452" width="15" height="28" rx="3"/><rect class="cell" x="160" y="452" width="15" height="28" rx="3"/><rect class="key" x="177" y="452" width="15" height="28" rx="3"/><g><path class="ln" d="M200,466 L256,466" marker-end="url(#a)"/><text class="xs" x="228" y="458" text-anchor="middle">expand</text><text class="xs" x="264" y="444" text-anchor="start">Tape, with the change applied</text><rect class="key" x="264" y="452" width="18" height="28" rx="3"/><rect class="cell" x="284" y="452" width="18" height="28" rx="3"/><rect class="cell" x="304" y="452" width="18" height="28" rx="3"/><rect class="key" x="324" y="452" width="18" height="28" rx="3"/><rect class="cell" x="344" y="452" width="18" height="28" rx="3"/><rect class="cell" x="364" y="452" width="18" height="28" rx="3"/><rect class="key" x="384" y="452" width="18" height="28" rx="3"/><rect class="cell" x="404" y="452" width="18" height="28" rx="3"/><rect class="cell" x="424" y="452" width="18" height="28" rx="3"/><rect class="hi" x="342" y="450" width="22" height="32" rx="4"/></g><g><path class="ln" d="M452,466 L508,466" marker-end="url(#a)"/><text class="xs" x="480" y="458" text-anchor="middle">emit</text><text class="xs" x="516" y="444" text-anchor="start">Spine over smaller packed blocks</text><rect class="word" x="516" y="452" width="52" height="28" rx="3"/><text class="mw" x="542.0" y="470.0" text-anchor="middle">ptr</text><path class="ln" d="M542,482 L542,502" marker-end="url(#a)"/><rect class="cell" x="516" y="504" width="52" height="24" rx="3"/><text class="ms" x="542.0" y="520.0" text-anchor="middle">packed</text><rect class="word" x="572" y="452" width="52" height="28" rx="3"/><text class="mw" x="598.0" y="470.0" text-anchor="middle">ptr</text><path class="ln" d="M598,482 L598,502" marker-end="url(#a)"/><rect class="cell" x="572" y="504" width="52" height="24" rx="3"/><text class="ms" x="598.0" y="520.0" text-anchor="middle">packed</text><rect class="word" x="628" y="452" width="52" height="28" rx="3"/><text class="mw" x="654.0" y="470.0" text-anchor="middle">ptr</text><path class="ln" d="M654,482 L654,502" marker-end="url(#a)"/><rect class="cell" x="628" y="504" width="52" height="24" rx="3"/><text class="ms" x="654.0" y="520.0" text-anchor="middle">packed</text><rect class="word" x="684" y="452" width="34" height="28" rx="3"/><text class="mw" x="701.0" y="470.0" text-anchor="middle">…</text></g><rect class="hdr" x="24" y="549" width="14" height="14" rx="3"/><text class="xs" x="44" y="560" text-anchor="start">container header</text><rect class="key" x="169.2" y="549" width="14" height="14" rx="3"/><text class="xs" x="189.2" y="560" text-anchor="start">member-name ID</text><rect class="cell" x="302.0" y="549" width="14" height="14" rx="3"/><text class="xs" x="322.0" y="560" text-anchor="start">value</text><rect class="word" x="379.0" y="549" width="14" height="14" rx="3"/><text class="xs" x="399.0" y="560" text-anchor="start">pointer word</text></svg>