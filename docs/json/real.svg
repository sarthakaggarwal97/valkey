<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="299" rx="10"/><text class="t" x="24" y="34" text-anchor="start">Memory per key on real data, as a percentage of valkey-json</text><text class="s" x="24" y="56" text-anchor="start">Lower is better. used_memory per key, including the key name. Graviton3, median of three rounds.</text><line class="grid" x1="300.0" y1="84" x2="300.0" y2="212"/><text class="xs" x="300.0" y="228" text-anchor="middle">0%</text><line class="grid" x1="427.27272727272725" y1="84" x2="427.27272727272725" y2="212"/><text class="xs" x="427.27272727272725" y="228" text-anchor="middle">25%</text><line class="grid" x1="554.5454545454545" y1="84" x2="554.5454545454545" y2="212"/><text class="xs" x="554.5454545454545" y="228" text-anchor="middle">50%</text><line class="grid" x1="681.8181818181818" y1="84" x2="681.8181818181818" y2="212"/><text class="xs" x="681.8181818181818" y="228" text-anchor="middle">75%</text><line class="grid" x1="809.090909090909" y1="84" x2="809.090909090909" y2="212"/><text class="xs" x="809.090909090909" y="228" text-anchor="middle">100%</text><text class="s" x="290" y="111" text-anchor="end">NYC taxi trips, 1,000,000</text><rect class="bar" x="300" y="97" height="20" width="157.8181818181818" rx="4"/><text class="n" x="463.8181818181818" y="111" text-anchor="start">31%</text><text class="s" x="290" y="141" text-anchor="end">Twitter API tweets, 100,000</text><rect class="bar" x="300" y="127" height="20" width="239.27272727272728" rx="4"/><text class="n" x="545.2727272727273" y="141" text-anchor="start">47%</text><text class="s" x="290" y="171" text-anchor="end">Bluesky posts, 86,812</text><rect class="bar" x="300" y="157" height="20" width="295.27272727272725" rx="4"/><text class="n" x="601.2727272727273" y="171" text-anchor="start">58%</text><text class="s" x="290" y="201" text-anchor="end">Bluesky event stream, 1,000,000</text><rect class="bar" x="300" y="187" height="20" width="295.27272727272725" rx="4"/><text class="n" x="601.2727272727273" y="201" text-anchor="start">58%</text><line class="ref" x1="809.090909090909" y1="78" x2="809.090909090909" y2="212"/><text class="refl" x="803.090909090909" y="76" text-anchor="end">valkey-json = 100%</text><text class="s" x="24" y="258" text-anchor="start">Every sampled document read back equal to its source on both servers.</text></svg>