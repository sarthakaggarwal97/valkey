<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 544" width="920" height="544" role="img" aria-label="How a JSON document is stored: packed blocks for small subtrees, a spine for large containers">
<style>
  .bg{fill:#fcfcfb;stroke:#e4e3df}
  .t{fill:#0b0b0b;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}
  .h{fill:#0b0b0b;font:600 14px system-ui,-apple-system,Segoe UI,sans-serif}
  .s{fill:#52514e;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
  .m{fill:#0b0b0b;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .mw{fill:#ffffff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cell{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
  .key{fill:#fde3d6;stroke:#eb6834;stroke-width:1}
  .hdr{fill:#e9e8e4;stroke:#8a8984;stroke-width:1}
  .word{fill:#2a78d6;stroke:#1c5cab;stroke-width:1}
  .box{fill:none;stroke:#c9c8c2;stroke-width:1;stroke-dasharray:4 3}
  .ln{stroke:#8a8984;stroke-width:1.5;fill:none}
  .kl{stroke:#eb6834;stroke-width:1.5;fill:none}
  .bar{fill:#2a78d6}
  .ref{stroke:#eb6834;stroke-width:2;stroke-dasharray:5 4}
  .refl{fill:#c2410c;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif}
  .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .xs{fill:#6b6a66;font:11px system-ui,-apple-system,Segoe UI,sans-serif}
  .n{fill:#0b0b0b;font:12px system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
  .ms{fill:#0b0b0b;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .br{stroke:#8a8984;stroke-width:1;fill:none}
  .grid{stroke:#e4e3df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .xs{fill:#6b6a66;font:11px system-ui,-apple-system,Segoe UI,sans-serif}
  .n{fill:#0b0b0b;font:12px system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
  .ms{fill:#0b0b0b;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .br{stroke:#8a8984;stroke-width:1;fill:none}
  .grid{stroke:#383835}
    .xs{fill:#a3a29b}
    .n,.ms{fill:#f0efec}
    .br{stroke:#a3a29b}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="543" rx="10"/><text class="t" x="24" y="34" text-anchor="start">How a document is stored</text><text class="s" x="24" y="54" text-anchor="start">Small subtrees become packed blocks. Only large containers get a spine of 8-byte words.</text><text class="xs" x="24" y="82" text-anchor="start">JSON text</text><rect class="hdr" x="24" y="88" width="330" height="30" rx="3"/><text class="m" x="36" y="107" text-anchor="start">{"name":"Ada","age":36,"tags":["x","y"]}</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/><path class="ln" d="M362,103 L428,103" marker-end="url(#a)"/><text class="xs" x="395" y="96" text-anchor="middle">parse once</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.6s" fill="freeze"/><text class="xs" x="438" y="82" text-anchor="start">Tape: every value in document order, temporary</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/><rect class="hdr" x="438" y="88" width="30" height="30" rx="3"/><text class="ms" x="453.0" y="107.0" text-anchor="middle">{</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/><rect class="key" x="472" y="88" width="30" height="30" rx="3"/><text class="ms" x="487.0" y="107.0" text-anchor="middle">#1</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.6s" fill="freeze"/><rect class="cell" x="506" y="88" width="30" height="30" rx="3"/><text class="m" x="521.0" y="107.0" text-anchor="middle">Ada</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/><rect class="key" x="540" y="88" width="30" height="30" rx="3"/><text class="ms" x="555.0" y="107.0" text-anchor="middle">#2</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.6s" fill="freeze"/><rect class="cell" x="574" y="88" width="30" height="30" rx="3"/><text class="ms" x="589.0" y="107.0" text-anchor="middle">36</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.6s" fill="freeze"/><rect class="key" x="608" y="88" width="30" height="30" rx="3"/><text class="ms" x="623.0" y="107.0" text-anchor="middle">#3</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4000000000000004s" dur="0.6s" fill="freeze"/><rect class="hdr" x="642" y="88" width="30" height="30" rx="3"/><text class="ms" x="657.0" y="107.0" text-anchor="middle">[</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.6s" fill="freeze"/><rect class="cell" x="676" y="88" width="30" height="30" rx="3"/><text class="ms" x="691.0" y="107.0" text-anchor="middle">x</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.6s" fill="freeze"/><rect class="cell" x="710" y="88" width="30" height="30" rx="3"/><text class="ms" x="725.0" y="107.0" text-anchor="middle">y</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.6s" fill="freeze"/><rect class="hdr" x="744" y="88" width="30" height="30" rx="3"/><text class="ms" x="759.0" y="107.0" text-anchor="middle">]</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.6s" fill="freeze"/><rect class="hdr" x="778" y="88" width="30" height="30" rx="3"/><text class="ms" x="793.0" y="107.0" text-anchor="middle">}</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.6s" fill="freeze"/><path class="ln" d="M625,120 L625,142"/><path class="ln" d="M238,142 L682,142"/><path class="ln" d="M238,142 L238,168" marker-end="url(#a)"/><path class="ln" d="M682,142 L682,168" marker-end="url(#a)"/><text class="xs" x="633" y="136" text-anchor="start">emit</text><text class="xs" x="246" y="160" text-anchor="start">fits in 4 KB and 128 entries</text><text class="xs" x="690" y="160" text-anchor="start">too large</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.6s" fill="freeze"/><rect class="box" x="24" y="172" width="428" height="324" rx="8"/><text class="h" x="44" y="198" text-anchor="start">Packed block</text><text class="s" x="44" y="216" text-anchor="start">One allocation, no pointers inside. Drawn to scale.</text><rect class="hdr" x="45" y="250" width="58" height="30" rx="3"/><text class="m" x="74.0" y="269.0" text-anchor="middle">obj 16</text><rect class="key" x="105" y="250" width="18" height="30" rx="3"/><text class="ms" x="114.0" y="269.0" text-anchor="middle">#1</text><rect class="cell" x="125" y="250" width="78" height="30" rx="3"/><text class="m" x="164.0" y="269.0" text-anchor="middle">Ada</text><rect class="key" x="205" y="250" width="18" height="30" rx="3"/><text class="ms" x="214.0" y="269.0" text-anchor="middle">#2</text><rect class="cell" x="225" y="250" width="38" height="30" rx="3"/><text class="m" x="244.0" y="269.0" text-anchor="middle">36</text><rect class="key" x="265" y="250" width="18" height="30" rx="3"/><text class="ms" x="274.0" y="269.0" text-anchor="middle">#3</text><rect class="hdr" x="285" y="250" width="58" height="30" rx="3"/><text class="m" x="314.0" y="269.0" text-anchor="middle">arr 4</text><rect class="cell" x="345" y="250" width="38" height="30" rx="3"/><text class="m" x="364.0" y="269.0" text-anchor="middle">x</text><rect class="cell" x="385" y="250" width="38" height="30" rx="3"/><text class="m" x="404.0" y="269.0" text-anchor="middle">y</text><path class="br" d="M285,238 L285,242 L423,242 L423,238"/><text class="xs" x="354.0" y="236" text-anchor="middle">the tags array, nested</text><text class="xs" x="74.0" y="294" text-anchor="middle">3</text><text class="xs" x="114.0" y="294" text-anchor="middle">1</text><text class="xs" x="164.0" y="294" text-anchor="middle">4</text><text class="xs" x="214.0" y="294" text-anchor="middle">1</text><text class="xs" x="244.0" y="294" text-anchor="middle">2</text><text class="xs" x="274.0" y="294" text-anchor="middle">1</text><text class="xs" x="314.0" y="294" text-anchor="middle">3</text><text class="xs" x="364.0" y="294" text-anchor="middle">2</text><text class="xs" x="404.0" y="294" text-anchor="middle">2</text><path class="br" d="M44,306 L44,302 L424,302 L424,306"/><text class="s" x="234.0" y="318" text-anchor="middle">19 bytes</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.4s" dur="0.6s" fill="freeze"/><text class="h" x="44" y="354" text-anchor="start">Shared key table</text><text class="s" x="44" y="372" text-anchor="start">Each #n in a block is an ID here. A name is stored once.</text><rect class="key" x="44" y="384" width="116" height="28" rx="3"/><text class="m" x="102.0" y="402.0" text-anchor="middle">#1  name</text><rect class="key" x="168" y="384" width="116" height="28" rx="3"/><text class="m" x="226.0" y="402.0" text-anchor="middle">#2  age</text><rect class="key" x="292" y="384" width="116" height="28" rx="3"/><text class="m" x="350.0" y="402.0" text-anchor="middle">#3  tags</text><text class="xs" x="44" y="452" text-anchor="start">valkey-json stores the same document as a tree</text><text class="xs" x="44" y="468" text-anchor="start">of 16-byte nodes, plus a vector for each container.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.6s" fill="freeze"/><rect class="box" x="468" y="172" width="428" height="324" rx="8"/><text class="h" x="488" y="198" text-anchor="start">Spine</text><text class="s" x="488" y="216" text-anchor="start">One 8-byte word per element, for containers over the limits.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="9.0s" dur="0.6s" fill="freeze"/><text class="m" x="488" y="240" text-anchor="start">[ {…}, {…}, … ]   100,000 records</text><rect class="hdr" x="488" y="250" width="68" height="28" rx="3"/><text class="ms" x="522.0" y="268.0" text-anchor="middle">ARRAY</text><rect class="word" x="560" y="250" width="64" height="28" rx="3"/><text class="mw" x="592.0" y="268.0" text-anchor="middle">ptr</text><path class="ln" d="M592,280 L592,304" marker-end="url(#a)"/><rect class="cell" x="560" y="306" width="64" height="26" rx="3"/><text class="ms" x="592.0" y="323.0" text-anchor="middle">packed</text><rect class="word" x="628" y="250" width="64" height="28" rx="3"/><text class="mw" x="660.0" y="268.0" text-anchor="middle">ptr</text><path class="ln" d="M660,280 L660,304" marker-end="url(#a)"/><rect class="cell" x="628" y="306" width="64" height="26" rx="3"/><text class="ms" x="660.0" y="323.0" text-anchor="middle">packed</text><rect class="word" x="696" y="250" width="64" height="28" rx="3"/><text class="mw" x="728.0" y="268.0" text-anchor="middle">ptr</text><path class="ln" d="M728,280 L728,304" marker-end="url(#a)"/><rect class="cell" x="696" y="306" width="64" height="26" rx="3"/><text class="ms" x="728.0" y="323.0" text-anchor="middle">packed</text><rect class="word" x="764" y="250" width="40" height="28" rx="3"/><text class="mw" x="784.0" y="268.0" text-anchor="middle">…</text><text class="xs" x="552" y="296" text-anchor="end">points to</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="10.6s" dur="0.6s" fill="freeze"/><text class="m" x="488" y="364" text-anchor="start">[ 1, 2, 3, … ]   100,000 integers</text><rect class="hdr" x="488" y="374" width="68" height="28" rx="3"/><text class="ms" x="522.0" y="392.0" text-anchor="middle">TARRAY</text><rect class="cell" x="560" y="374" width="32" height="28" rx="3"/><text class="ms" x="576.0" y="392.0" text-anchor="middle">1</text><rect class="cell" x="594" y="374" width="32" height="28" rx="3"/><text class="ms" x="610.0" y="392.0" text-anchor="middle">2</text><rect class="cell" x="628" y="374" width="32" height="28" rx="3"/><text class="ms" x="644.0" y="392.0" text-anchor="middle">3</text><rect class="cell" x="662" y="374" width="32" height="28" rx="3"/><text class="ms" x="678.0" y="392.0" text-anchor="middle">4</text><rect class="cell" x="696" y="374" width="32" height="28" rx="3"/><text class="ms" x="712.0" y="392.0" text-anchor="middle">5</text><rect class="cell" x="730" y="374" width="32" height="28" rx="3"/><text class="ms" x="746.0" y="392.0" text-anchor="middle">…</text><text class="xs" x="770" y="392" text-anchor="start">4 bytes each</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="12.0s" dur="0.6s" fill="freeze"/><text class="s" x="488" y="428" text-anchor="start">A word can also hold a small value itself</text><rect class="cell" x="488" y="438" width="90" height="28" rx="3"/><text class="m" x="533.0" y="456.0" text-anchor="middle">36</text><text class="xs" x="533" y="482" text-anchor="middle">integer</text><rect class="cell" x="586" y="438" width="90" height="28" rx="3"/><text class="m" x="631.0" y="456.0" text-anchor="middle">"Ada"</text><text class="xs" x="631" y="482" text-anchor="middle">string up to 7 B</text><rect class="cell" x="684" y="438" width="90" height="28" rx="3"/><text class="m" x="729.0" y="456.0" text-anchor="middle">19.90</text><text class="xs" x="729" y="482" text-anchor="middle">decimal</text><rect class="word" x="782" y="438" width="90" height="28" rx="3"/><text class="mw" x="827.0" y="456.0" text-anchor="middle">ptr</text><text class="xs" x="827" y="482" text-anchor="middle">heap node</text></g><rect class="hdr" x="24" y="515" width="14" height="14" rx="3"/><text class="xs" x="44" y="526" text-anchor="start">container header</text><rect class="key" x="169.2" y="515" width="14" height="14" rx="3"/><text class="xs" x="189.2" y="526" text-anchor="start">member-name ID</text><rect class="cell" x="302.0" y="515" width="14" height="14" rx="3"/><text class="xs" x="322.0" y="526" text-anchor="start">value</text><rect class="word" x="379.0" y="515" width="14" height="14" rx="3"/><text class="xs" x="399.0" y="526" text-anchor="start">pointer word</text></svg>