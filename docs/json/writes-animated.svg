  .hdr{fill:#e9e8e4;stroke:#8a8984;stroke-width:1}
  .word{fill:#2a78d6;stroke:#1c5cab;stroke-width:1}
  .box{fill:none;stroke:#c9c8c2;stroke-width:1;stroke-dasharray:4 3}
  .ln{stroke:#8a8984;stroke-width:1.5;fill:none}
  .kl{stroke:#eb6834;stroke-width:1.5;fill:none}
  .bar{fill:#2a78d6}
  .ref{stroke:#eb6834;stroke-width:2;stroke-dasharray:5 4}
  .refl{fill:#c2410c;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif}
  .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .grid{stroke:#e4e3df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .grid{stroke:#383835}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="499" rx="10"/><text class="t" x="24" y="34" text-anchor="start">Three ways a write changes a packed block</text><text class="h" x="24" y="66" text-anchor="start">In place: the new value is the same size</text><text class="s" x="24" y="85" text-anchor="start">JSON.NUMINCRBY doc $.age 1 overwrites one byte. It takes 0.64 µs, against 1.69 µs in valkey-json.</text><text class="s" x="24" y="118" text-anchor="start">Before</text><rect class="hdr" x="90" y="99" width="58" height="28" rx="3"/><text class="m" x="119.0" y="117.0" text-anchor="middle">obj 19</text><rect class="key" x="150" y="99" width="22" height="28" rx="3"/><text class="m" x="161.0" y="117.0" text-anchor="middle">#1</text><rect class="cell" x="174" y="99" width="58" height="28" rx="3"/><text class="m" x="203.0" y="117.0" text-anchor="middle">Ada</text><rect class="key" x="234" y="99" width="22" height="28" rx="3"/><text class="m" x="245.0" y="117.0" text-anchor="middle">#2</text><rect class="cell" x="258" y="99" width="38" height="28" rx="3"/><text class="m" x="277.0" y="117.0" text-anchor="middle">36</text><rect class="key" x="298" y="99" width="22" height="28" rx="3"/><text class="m" x="309.0" y="117.0" text-anchor="middle">#3</text><rect class="hdr" x="322" y="99" width="48" height="28" rx="3"/><text class="m" x="346.0" y="117.0" text-anchor="middle">arr</text><rect class="cell" x="372" y="99" width="32" height="28" rx="3"/><text class="m" x="388.0" y="117.0" text-anchor="middle">x</text><rect class="cell" x="406" y="99" width="32" height="28" rx="3"/><text class="m" x="422.0" y="117.0" text-anchor="middle">y</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.6s" fill="freeze"/><text class="s" x="24" y="158" text-anchor="start">After</text><rect class="hdr" x="90" y="139" width="58" height="28" rx="3"/><text class="m" x="119.0" y="157.0" text-anchor="middle">obj 19</text><rect class="key" x="150" y="139" width="22" height="28" rx="3"/><text class="m" x="161.0" y="157.0" text-anchor="middle">#1</text><rect class="cell" x="174" y="139" width="58" height="28" rx="3"/><text class="m" x="203.0" y="157.0" text-anchor="middle">Ada</text><rect class="key" x="234" y="139" width="22" height="28" rx="3"/><text class="m" x="245.0" y="157.0" text-anchor="middle">#2</text><rect class="cell" x="258" y="139" width="38" height="28" rx="3"/><text class="m" x="277.0" y="157.0" text-anchor="middle">37</text><rect class="hi" x="256" y="137" width="42" height="32" rx="4"/><rect class="key" x="298" y="139" width="22" height="28" rx="3"/><text class="m" x="309.0" y="157.0" text-anchor="middle">#3</text><rect class="hdr" x="322" y="139" width="48" height="28" rx="3"/><text class="m" x="346.0" y="157.0" text-anchor="middle">arr</text><rect class="cell" x="372" y="139" width="32" height="28" rx="3"/><text class="m" x="388.0" y="157.0" text-anchor="middle">x</text><rect class="cell" x="406" y="139" width="32" height="28" rx="3"/><text class="m" x="422.0" y="157.0" text-anchor="middle">y</text></g><text class="h" x="24" y="200" text-anchor="start">Splice: the size changes, but the block still fits</text><text class="s" x="24" y="219" text-anchor="start">JSON.SET doc $.name '"Adaline"' moves the bytes after the name and updates the size. 0.85 µs, against 1.55 µs.</text><text class="s" x="24" y="252" text-anchor="start">Before</text><rect class="hdr" x="90" y="233" width="58" height="28" rx="3"/><text class="m" x="119.0" y="251.0" text-anchor="middle">obj 19</text><rect class="key" x="150" y="233" width="22" height="28" rx="3"/><text class="m" x="161.0" y="251.0" text-anchor="middle">#1</text><rect class="cell" x="174" y="233" width="58" height="28" rx="3"/><text class="m" x="203.0" y="251.0" text-anchor="middle">Ada</text><rect class="key" x="234" y="233" width="22" height="28" rx="3"/><text class="m" x="245.0" y="251.0" text-anchor="middle">#2</text><rect class="cell" x="258" y="233" width="38" height="28" rx="3"/><text class="m" x="277.0" y="251.0" text-anchor="middle">36</text><rect class="key" x="298" y="233" width="22" height="28" rx="3"/><text class="m" x="309.0" y="251.0" text-anchor="middle">#3</text><rect class="hdr" x="322" y="233" width="48" height="28" rx="3"/><text class="m" x="346.0" y="251.0" text-anchor="middle">arr</text><rect class="cell" x="372" y="233" width="32" height="28" rx="3"/><text class="m" x="388.0" y="251.0" text-anchor="middle">x</text><rect class="cell" x="406" y="233" width="32" height="28" rx="3"/><text class="m" x="422.0" y="251.0" text-anchor="middle">y</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.6s" fill="freeze"/><text class="s" x="24" y="292" text-anchor="start">After</text><rect class="hdr" x="90" y="273" width="58" height="28" rx="3"/><text class="m" x="119.0" y="291.0" text-anchor="middle">obj 23</text><rect class="hi" x="88" y="271" width="62" height="32" rx="4"/><rect class="key" x="150" y="273" width="22" height="28" rx="3"/><text class="m" x="161.0" y="291.0" text-anchor="middle">#1</text><rect class="cell" x="174" y="273" width="98" height="28" rx="3"/><text class="m" x="223.0" y="291.0" text-anchor="middle">Adaline</text><rect class="hi" x="172" y="271" width="102" height="32" rx="4"/><rect class="key" x="274" y="273" width="22" height="28" rx="3"/><text class="m" x="285.0" y="291.0" text-anchor="middle">#2</text><rect class="cell" x="298" y="273" width="38" height="28" rx="3"/><text class="m" x="317.0" y="291.0" text-anchor="middle">36</text><rect class="key" x="338" y="273" width="22" height="28" rx="3"/><text class="m" x="349.0" y="291.0" text-anchor="middle">#3</text><rect class="hdr" x="362" y="273" width="48" height="28" rx="3"/><text class="m" x="386.0" y="291.0" text-anchor="middle">arr</text><rect class="cell" x="412" y="273" width="32" height="28" rx="3"/><text class="m" x="428.0" y="291.0" text-anchor="middle">x</text><rect class="cell" x="446" y="273" width="32" height="28" rx="3"/><text class="m" x="462.0" y="291.0" text-anchor="middle">y</text></g><text class="h" x="24" y="334" text-anchor="start">Re-emit: the block would grow past its limits</text><text class="s" x="24" y="353" text-anchor="start">The block is copied to a tape with the change applied and written out again. Here it becomes a spine.</text><text class="s" x="24" y="386" text-anchor="start">Before</text><rect class="key" x="90" y="367" width="30" height="28" rx="3"/><text class="m" x="105.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="123" y="367" width="30" height="28" rx="3"/><text class="m" x="138.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="156" y="367" width="30" height="28" rx="3"/><text class="m" x="171.0" y="385.0" text-anchor="middle"></text><rect class="key" x="189" y="367" width="30" height="28" rx="3"/><text class="m" x="204.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="222" y="367" width="30" height="28" rx="3"/><text class="m" x="237.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="255" y="367" width="30" height="28" rx="3"/><text class="m" x="270.0" y="385.0" text-anchor="middle"></text><rect class="key" x="288" y="367" width="30" height="28" rx="3"/><text class="m" x="303.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="321" y="367" width="30" height="28" rx="3"/><text class="m" x="336.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="354" y="367" width="30" height="28" rx="3"/><text class="m" x="369.0" y="385.0" text-anchor="middle"></text><rect class="key" x="387" y="367" width="30" height="28" rx="3"/><text class="m" x="402.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="420" y="367" width="30" height="28" rx="3"/><text class="m" x="435.0" y="385.0" text-anchor="middle"></text><rect class="cell" x="453" y="367" width="30" height="28" rx="3"/><text class="m" x="468.0" y="385.0" text-anchor="middle"></text><text class="s" x="494" y="386" text-anchor="start">4,096 bytes: the block is full</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.6s" fill="freeze"/><text class="s" x="24" y="426" text-anchor="start">After</text><rect class="word" x="90" y="407" width="42" height="28" rx="3"/><text class="mw" x="111.0" y="425.0" text-anchor="middle">ptr</text><rect class="word" x="136" y="407" width="42" height="28" rx="3"/><text class="mw" x="157.0" y="425.0" text-anchor="middle">ptr</text><rect class="word" x="182" y="407" width="42" height="28" rx="3"/><text class="mw" x="203.0" y="425.0" text-anchor="middle">ptr</text><rect class="word" x="228" y="407" width="42" height="28" rx="3"/><text class="mw" x="249.0" y="425.0" text-anchor="middle">…</text><path class="ln" d="M111,436 L150,450" marker-end="url(#a)"/><rect class="cell" x="90" y="452" width="120" height="28" rx="3"/><text class="m" x="150.0" y="470.0" text-anchor="middle">packed block</text><path class="ln" d="M157,436 L280,450" marker-end="url(#a)"/><rect class="cell" x="220" y="452" width="120" height="28" rx="3"/><text class="m" x="280.0" y="470.0" text-anchor="middle">packed block</text><path class="ln" d="M203,436 L410,450" marker-end="url(#a)"/><rect class="cell" x="350" y="452" width="120" height="28" rx="3"/><text class="m" x="410.0" y="470.0" text-anchor="middle">packed block</text><text class="s" x="300" y="426" text-anchor="start">A pointer array over smaller packed blocks. The emitter decides the shape.</text></g></svg>