<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 466" width="920" height="466" role="img" aria-label="How a JSON document is stored: packed block, key table and spine">
<style>
  .bg{fill:#fcfcfb;stroke:#e4e3df}
  .t{fill:#0b0b0b;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}
  .h{fill:#0b0b0b;font:600 14px system-ui,-apple-system,Segoe UI,sans-serif}
  .s{fill:#52514e;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
  .m{fill:#0b0b0b;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .mw{fill:#ffffff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cell{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
  .key{fill:#fde3d6;stroke:#eb6834;stroke-width:1}
  .hdr{fill:#e9e8e4;stroke:#8a8984;stroke-width:1}
  .word{fill:#2a78d6;stroke:#1c5cab;stroke-width:1}
  .box{fill:none;stroke:#c9c8c2;stroke-width:1;stroke-dasharray:4 3}
  .ln{stroke:#8a8984;stroke-width:1.5;fill:none}
  .kl{stroke:#eb6834;stroke-width:1.5;fill:none}
  .bar{fill:#2a78d6}
  .ref{stroke:#eb6834;stroke-width:2;stroke-dasharray:5 4}
  .refl{fill:#c2410c;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif}
  .grid{stroke:#e4e3df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .grid{stroke:#383835}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="465" rx="10"/><text class="t" x="24" y="34">How a document is stored</text><rect class="hdr" x="24" y="50" width="390" height="30" rx="4"/><text class="m" x="36" y="70">{"name":"Ada","age":36,"tags":["x","y"]}</text><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0250;0.0542;0.96;1"/><text class="s" x="430" y="70">① parse once onto a tape: no allocation per value</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0500;0.0792;0.96;1"/><rect class="hdr" x="24" y="92" width="38" height="26" rx="3"/><text class="m" x="43.0" y="109.0" text-anchor="middle">{</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0600;0.0892;0.96;1"/><rect class="key" x="66" y="92" width="38" height="26" rx="3"/><text class="m" x="85.0" y="109.0" text-anchor="middle">#1</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0700;0.0992;0.96;1"/><rect class="cell" x="108" y="92" width="38" height="26" rx="3"/><text class="m" x="127.0" y="109.0" text-anchor="middle">Ada</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0800;0.1092;0.96;1"/><rect class="key" x="150" y="92" width="38" height="26" rx="3"/><text class="m" x="169.0" y="109.0" text-anchor="middle">#2</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0900;0.1192;0.96;1"/><rect class="cell" x="192" y="92" width="38" height="26" rx="3"/><text class="m" x="211.0" y="109.0" text-anchor="middle">36</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1000;0.1292;0.96;1"/><rect class="key" x="234" y="92" width="38" height="26" rx="3"/><text class="m" x="253.0" y="109.0" text-anchor="middle">#3</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1100;0.1392;0.96;1"/><rect class="hdr" x="276" y="92" width="38" height="26" rx="3"/><text class="m" x="295.0" y="109.0" text-anchor="middle">[</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1200;0.1492;0.96;1"/><rect class="cell" x="318" y="92" width="38" height="26" rx="3"/><text class="m" x="337.0" y="109.0" text-anchor="middle">x</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1300;0.1592;0.96;1"/><rect class="cell" x="360" y="92" width="38" height="26" rx="3"/><text class="m" x="379.0" y="109.0" text-anchor="middle">y</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1400;0.1692;0.96;1"/><rect class="hdr" x="402" y="92" width="38" height="26" rx="3"/><text class="m" x="421.0" y="109.0" text-anchor="middle">]</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1500;0.1792;0.96;1"/><rect class="hdr" x="444" y="92" width="38" height="26" rx="3"/><text class="m" x="463.0" y="109.0" text-anchor="middle">}</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1833;0.2125;0.96;1"/><text class="s" x="24" y="146">② emit: does each subtree fit the caps (4,096 bytes, 128 entries per container)?</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2167;0.2458;0.96;1"/><rect class="box" x="24" y="160" width="430" height="290" rx="8"/><text class="h" x="40" y="184">Fits: one packed block</text><text class="s" x="40" y="203">like a listpack: one allocation, no pointers</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2500;0.2792;0.96;1"/><rect class="hdr" x="40" y="220" width="58" height="30" rx="3"/><text class="m" x="69.0" y="239.0" text-anchor="middle">obj</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2650;0.2942;0.96;1"/><rect class="key" x="100" y="220" width="28" height="30" rx="3"/><text class="m" x="114.0" y="239.0" text-anchor="middle">#1</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2800;0.3092;0.96;1"/><rect class="cell" x="130" y="220" width="78" height="30" rx="3"/><text class="m" x="169.0" y="239.0" text-anchor="middle">Ada</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2950;0.3242;0.96;1"/><rect class="key" x="210" y="220" width="28" height="30" rx="3"/><text class="m" x="224.0" y="239.0" text-anchor="middle">#2</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3100;0.3392;0.96;1"/><rect class="cell" x="240" y="220" width="38" height="30" rx="3"/><text class="m" x="259.0" y="239.0" text-anchor="middle">36</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3250;0.3542;0.96;1"/><rect class="key" x="280" y="220" width="28" height="30" rx="3"/><text class="m" x="294.0" y="239.0" text-anchor="middle">#3</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3400;0.3692;0.96;1"/><rect class="hdr" x="310" y="220" width="58" height="30" rx="3"/><text class="m" x="339.0" y="239.0" text-anchor="middle">arr</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3550;0.3842;0.96;1"/><rect class="cell" x="370" y="220" width="38" height="30" rx="3"/><text class="m" x="389.0" y="239.0" text-anchor="middle">x</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3700;0.3992;0.96;1"/><rect class="cell" x="410" y="220" width="38" height="30" rx="3"/><text class="m" x="429.0" y="239.0" text-anchor="middle">y</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.4000;0.4292;0.96;1"/><text class="s" x="40" y="404">19 bytes in all. valkey-json keeps a tree of 16-byte</text><text class="s" x="40" y="422">nodes, with a heap vector for the object and the array.</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.4417;0.4708;0.96;1"/><rect class="key" x="40" y="296" width="120" height="28" rx="3"/><text class="m" x="100.0" y="314.0" text-anchor="middle">#1 name ×N</text><path class="kl" d="M114.0,252 C114.0,276 100,272 100,294" marker-end="url(#a)"/><rect class="key" x="176" y="296" width="120" height="28" rx="3"/><text class="m" x="236.0" y="314.0" text-anchor="middle">#2 age ×N</text><path class="kl" d="M224.0,252 C224.0,276 236,272 236,294" marker-end="url(#a)"/><rect class="key" x="312" y="296" width="120" height="28" rx="3"/><text class="m" x="372.0" y="314.0" text-anchor="middle">#3 tags ×N</text><path class="kl" d="M294.0,252 C294.0,276 372,272 372,294" marker-end="url(#a)"/><text class="h" x="40" y="348">Key table, shared by every document</text><text class="s" x="40" y="366">refcounted, like shared objects: each name is stored once</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5333;0.5625;0.96;1"/><rect class="box" x="470" y="160" width="426" height="290" rx="8"/><text class="h" x="486" y="184">Too big: a spine of 8-byte words</text><text class="s" x="486" y="203">like quicklist: a pointer array over packed blocks</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5667;0.5958;0.96;1"/><text class="m" x="486" y="228">[ {record}, {record}, … 100,000 ]</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5917;0.6208;0.96;1"/><rect class="word" x="486" y="238" width="42" height="26" rx="3"/><text class="mw" x="507.0" y="255.0" text-anchor="middle">ptr</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6017;0.6308;0.96;1"/><rect class="word" x="532" y="238" width="42" height="26" rx="3"/><text class="mw" x="553.0" y="255.0" text-anchor="middle">ptr</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6117;0.6408;0.96;1"/><rect class="word" x="578" y="238" width="42" height="26" rx="3"/><text class="mw" x="599.0" y="255.0" text-anchor="middle">ptr</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6217;0.6508;0.96;1"/><rect class="word" x="624" y="238" width="42" height="26" rx="3"/><text class="mw" x="645.0" y="255.0" text-anchor="middle">ptr</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6317;0.6608;0.96;1"/><rect class="word" x="670" y="238" width="42" height="26" rx="3"/><text class="mw" x="691.0" y="255.0" text-anchor="middle">…</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6500;0.6792;0.96;1"/><path class="ln" d="M507,266 L541,296" marker-end="url(#a)"/><rect class="cell" x="486" y="298" width="110" height="26" rx="3"/><text class="m" x="541.0" y="315.0" text-anchor="middle">packed record</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6625;0.6917;0.96;1"/><path class="ln" d="M553,266 L669,296" marker-end="url(#a)"/><rect class="cell" x="614" y="298" width="110" height="26" rx="3"/><text class="m" x="669.0" y="315.0" text-anchor="middle">packed record</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6750;0.7042;0.96;1"/><path class="ln" d="M599,266 L797,296" marker-end="url(#a)"/><rect class="cell" x="742" y="298" width="110" height="26" rx="3"/><text class="m" x="797.0" y="315.0" text-anchor="middle">packed record</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7167;0.7458;0.96;1"/><text class="m" x="486" y="356">[ 1, 2, 3, … 100,000 ]</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7417;0.7708;0.96;1"/><rect class="cell" x="486" y="366" width="32" height="24" rx="3"/><text class="m" x="502.0" y="382.0" text-anchor="middle">1</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7500;0.7792;0.96;1"/><rect class="cell" x="520" y="366" width="32" height="24" rx="3"/><text class="m" x="536.0" y="382.0" text-anchor="middle">2</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7583;0.7875;0.96;1"/><rect class="cell" x="554" y="366" width="32" height="24" rx="3"/><text class="m" x="570.0" y="382.0" text-anchor="middle">3</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7667;0.7958;0.96;1"/><rect class="cell" x="588" y="366" width="32" height="24" rx="3"/><text class="m" x="604.0" y="382.0" text-anchor="middle">4</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7750;0.8042;0.96;1"/><rect class="cell" x="622" y="366" width="32" height="24" rx="3"/><text class="m" x="638.0" y="382.0" text-anchor="middle">5</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7833;0.8125;0.96;1"/><rect class="cell" x="656" y="366" width="32" height="24" rx="3"/><text class="m" x="672.0" y="382.0" text-anchor="middle">…</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.8000;0.8292;0.96;1"/><text class="s" x="700" y="383">typed array: like intset,</text><text class="s" x="700" y="399">4 bytes per element</text></g><g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.8333;0.8625;0.96;1"/><text class="s" x="486" y="432">Small ints, short strings and decimals live inside the word.</text></g></svg>