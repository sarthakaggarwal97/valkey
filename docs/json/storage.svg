<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 466" width="920" height="466" role="img" aria-label="How a JSON document is stored">
<style>
  .bg{fill:#fcfcfb;stroke:#e4e3df}
  .t{fill:#0b0b0b;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}
  .h{fill:#0b0b0b;font:600 14px system-ui,-apple-system,Segoe UI,sans-serif}
  .s{fill:#52514e;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
  .m{fill:#0b0b0b;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .mw{fill:#ffffff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cell{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
  .key{fill:#fde3d6;stroke:#eb6834;stroke-width:1}
  .hdr{fill:#e9e8e4;stroke:#8a8984;stroke-width:1}
  .word{fill:#2a78d6;stroke:#1c5cab;stroke-width:1}
  .box{fill:none;stroke:#c9c8c2;stroke-width:1;stroke-dasharray:4 3}
  .ln{stroke:#8a8984;stroke-width:1.5;fill:none}
  .kl{stroke:#eb6834;stroke-width:1.5;fill:none}
  .bar{fill:#2a78d6}
  .ref{stroke:#eb6834;stroke-width:2;stroke-dasharray:5 4}
  .refl{fill:#c2410c;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif}
  .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .grid{stroke:#e4e3df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .grid{stroke:#383835}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="465" rx="10"/><text class="t" x="24" y="34" text-anchor="start">How a document is stored</text><rect class="hdr" x="24" y="50" width="390" height="30" rx="4"/><text class="m" x="36" y="70" text-anchor="start">{"name":"Ada","age":36,"tags":["x","y"]}</text><g><text class="s" x="430" y="62" text-anchor="start">1. The parser reads the text once into a scratch tape.</text><text class="s" x="430" y="79" text-anchor="start">No value gets an allocation of its own.</text></g><g><rect class="hdr" x="24" y="92" width="38" height="26" rx="3"/><text class="m" x="43.0" y="109.0" text-anchor="middle">{</text></g><g><rect class="key" x="66" y="92" width="38" height="26" rx="3"/><text class="m" x="85.0" y="109.0" text-anchor="middle">#1</text></g><g><rect class="cell" x="108" y="92" width="38" height="26" rx="3"/><text class="m" x="127.0" y="109.0" text-anchor="middle">Ada</text></g><g><rect class="key" x="150" y="92" width="38" height="26" rx="3"/><text class="m" x="169.0" y="109.0" text-anchor="middle">#2</text></g><g><rect class="cell" x="192" y="92" width="38" height="26" rx="3"/><text class="m" x="211.0" y="109.0" text-anchor="middle">36</text></g><g><rect class="key" x="234" y="92" width="38" height="26" rx="3"/><text class="m" x="253.0" y="109.0" text-anchor="middle">#3</text></g><g><rect class="hdr" x="276" y="92" width="38" height="26" rx="3"/><text class="m" x="295.0" y="109.0" text-anchor="middle">[</text></g><g><rect class="cell" x="318" y="92" width="38" height="26" rx="3"/><text class="m" x="337.0" y="109.0" text-anchor="middle">x</text></g><g><rect class="cell" x="360" y="92" width="38" height="26" rx="3"/><text class="m" x="379.0" y="109.0" text-anchor="middle">y</text></g><g><rect class="hdr" x="402" y="92" width="38" height="26" rx="3"/><text class="m" x="421.0" y="109.0" text-anchor="middle">]</text></g><g><rect class="hdr" x="444" y="92" width="38" height="26" rx="3"/><text class="m" x="463.0" y="109.0" text-anchor="middle">}</text></g><g><text class="s" x="24" y="146" text-anchor="start">2. Every subtree that fits the limits (4,096 bytes and 128 entries) is written as one packed block.</text></g><g><rect class="box" x="24" y="160" width="430" height="290" rx="8"/><text class="h" x="40" y="184" text-anchor="start">Small enough: one packed block</text><text class="s" x="40" y="203" text-anchor="start">Like a listpack: a single allocation with no pointers.</text></g><g><rect class="hdr" x="40" y="220" width="58" height="30" rx="3"/><text class="m" x="69.0" y="239.0" text-anchor="middle">obj</text></g><g><rect class="key" x="100" y="220" width="28" height="30" rx="3"/><text class="m" x="114.0" y="239.0" text-anchor="middle">#1</text></g><g><rect class="cell" x="130" y="220" width="78" height="30" rx="3"/><text class="m" x="169.0" y="239.0" text-anchor="middle">Ada</text></g><g><rect class="key" x="210" y="220" width="28" height="30" rx="3"/><text class="m" x="224.0" y="239.0" text-anchor="middle">#2</text></g><g><rect class="cell" x="240" y="220" width="38" height="30" rx="3"/><text class="m" x="259.0" y="239.0" text-anchor="middle">36</text></g><g><rect class="key" x="280" y="220" width="28" height="30" rx="3"/><text class="m" x="294.0" y="239.0" text-anchor="middle">#3</text></g><g><rect class="hdr" x="310" y="220" width="58" height="30" rx="3"/><text class="m" x="339.0" y="239.0" text-anchor="middle">arr</text></g><g><rect class="cell" x="370" y="220" width="38" height="30" rx="3"/><text class="m" x="389.0" y="239.0" text-anchor="middle">x</text></g><g><rect class="cell" x="410" y="220" width="38" height="30" rx="3"/><text class="m" x="429.0" y="239.0" text-anchor="middle">y</text></g><g><rect class="key" x="40" y="296" width="120" height="28" rx="3"/><text class="m" x="100.0" y="314.0" text-anchor="middle">#1 = name</text><path class="kl" d="M114.0,252 C114.0,276 100,272 100,294" marker-end="url(#a)"/><rect class="key" x="176" y="296" width="120" height="28" rx="3"/><text class="m" x="236.0" y="314.0" text-anchor="middle">#2 = age</text><path class="kl" d="M224.0,252 C224.0,276 236,272 236,294" marker-end="url(#a)"/><rect class="key" x="312" y="296" width="120" height="28" rx="3"/><text class="m" x="372.0" y="314.0" text-anchor="middle">#3 = tags</text><path class="kl" d="M294.0,252 C294.0,276 372,272 372,294" marker-end="url(#a)"/><text class="h" x="40" y="348" text-anchor="start">The key table is shared by every document</text><text class="s" x="40" y="366" text-anchor="start">Like shared objects: each name is stored once and refcounted.</text></g><g><text class="s" x="40" y="404" text-anchor="start">The whole document takes 19 bytes. valkey-json builds a tree</text><text class="s" x="40" y="422" text-anchor="start">of 16-byte nodes, plus a heap vector for each container.</text></g><g><rect class="box" x="470" y="160" width="426" height="290" rx="8"/><text class="h" x="486" y="184" text-anchor="start">Too big: a spine of 8-byte words</text><text class="s" x="486" y="203" text-anchor="start">Like a quicklist: an array of pointers to packed blocks.</text></g><g><text class="m" x="486" y="228" text-anchor="start">[ {record}, {record}, … 100,000 more ]</text></g><g><rect class="word" x="486" y="238" width="42" height="26" rx="3"/><text class="mw" x="507.0" y="255.0" text-anchor="middle">ptr</text></g><g><rect class="word" x="532" y="238" width="42" height="26" rx="3"/><text class="mw" x="553.0" y="255.0" text-anchor="middle">ptr</text></g><g><rect class="word" x="578" y="238" width="42" height="26" rx="3"/><text class="mw" x="599.0" y="255.0" text-anchor="middle">ptr</text></g><g><rect class="word" x="624" y="238" width="42" height="26" rx="3"/><text class="mw" x="645.0" y="255.0" text-anchor="middle">ptr</text></g><g><rect class="word" x="670" y="238" width="42" height="26" rx="3"/><text class="mw" x="691.0" y="255.0" text-anchor="middle">…</text></g><g><path class="ln" d="M507,266 L541,296" marker-end="url(#a)"/><rect class="cell" x="486" y="298" width="110" height="26" rx="3"/><text class="m" x="541.0" y="315.0" text-anchor="middle">packed record</text></g><g><path class="ln" d="M553,266 L669,296" marker-end="url(#a)"/><rect class="cell" x="614" y="298" width="110" height="26" rx="3"/><text class="m" x="669.0" y="315.0" text-anchor="middle">packed record</text></g><g><path class="ln" d="M599,266 L797,296" marker-end="url(#a)"/><rect class="cell" x="742" y="298" width="110" height="26" rx="3"/><text class="m" x="797.0" y="315.0" text-anchor="middle">packed record</text></g><g><text class="m" x="486" y="356" text-anchor="start">[ 1, 2, 3, … 100,000 more ]</text></g><g><rect class="cell" x="486" y="366" width="32" height="24" rx="3"/><text class="m" x="502.0" y="382.0" text-anchor="middle">1</text></g><g><rect class="cell" x="520" y="366" width="32" height="24" rx="3"/><text class="m" x="536.0" y="382.0" text-anchor="middle">2</text></g><g><rect class="cell" x="554" y="366" width="32" height="24" rx="3"/><text class="m" x="570.0" y="382.0" text-anchor="middle">3</text></g><g><rect class="cell" x="588" y="366" width="32" height="24" rx="3"/><text class="m" x="604.0" y="382.0" text-anchor="middle">4</text></g><g><rect class="cell" x="622" y="366" width="32" height="24" rx="3"/><text class="m" x="638.0" y="382.0" text-anchor="middle">5</text></g><g><rect class="cell" x="656" y="366" width="32" height="24" rx="3"/><text class="m" x="672.0" y="382.0" text-anchor="middle">…</text></g><g><text class="s" x="700" y="377" text-anchor="start">A typed array, like an intset:</text><text class="s" x="700" y="393" text-anchor="start">4 bytes per element.</text></g><g><text class="s" x="486" y="432" text-anchor="start">Small integers, short strings and decimals sit inside the word.</text></g></svg>