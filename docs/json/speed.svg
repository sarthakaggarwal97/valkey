<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 528" width="920" height="528" role="img" aria-label="Speed-up per operation over valkey-json">
<style>
  .bg{fill:#fcfcfb;stroke:#e4e3df}
  .t{fill:#0b0b0b;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}
  .h{fill:#0b0b0b;font:600 14px system-ui,-apple-system,Segoe UI,sans-serif}
  .s{fill:#52514e;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
  .m{fill:#0b0b0b;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .mw{fill:#ffffff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cell{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
  .key{fill:#fde3d6;stroke:#eb6834;stroke-width:1}
  .hdr{fill:#e9e8e4;stroke:#8a8984;stroke-width:1}
  .word{fill:#2a78d6;stroke:#1c5cab;stroke-width:1}
  .box{fill:none;stroke:#c9c8c2;stroke-width:1;stroke-dasharray:4 3}
  .ln{stroke:#8a8984;stroke-width:1.5;fill:none}
  .kl{stroke:#eb6834;stroke-width:1.5;fill:none}
  .bar{fill:#2a78d6}
  .ref{stroke:#eb6834;stroke-width:2;stroke-dasharray:5 4}
  .refl{fill:#c2410c;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif}
  .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .grid{stroke:#e4e3df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .grid{stroke:#383835}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="527" rx="10"/><text class="t" x="24" y="34" text-anchor="start">Speed-up over valkey-json</text><text class="s" x="24" y="56" text-anchor="start">Higher is better. Server time per call for 11 of the 69 operations, first Graviton3 run.</text><line class="grid" x1="300.0" y1="84" x2="300.0" y2="422"/><text class="s" x="300.0" y="438" text-anchor="middle">0×</text><line class="grid" x1="358.9473684210526" y1="84" x2="358.9473684210526" y2="422"/><text class="s" x="358.9473684210526" y="438" text-anchor="middle">1×</text><line class="grid" x1="417.89473684210526" y1="84" x2="417.89473684210526" y2="422"/><text class="s" x="417.89473684210526" y="438" text-anchor="middle">2×</text><line class="grid" x1="535.7894736842105" y1="84" x2="535.7894736842105" y2="422"/><text class="s" x="535.7894736842105" y="438" text-anchor="middle">4×</text><line class="grid" x1="653.6842105263158" y1="84" x2="653.6842105263158" y2="422"/><text class="s" x="653.6842105263158" y="438" text-anchor="middle">6×</text><line class="grid" x1="771.578947368421" y1="84" x2="771.578947368421" y2="422"/><text class="s" x="771.578947368421" y="438" text-anchor="middle">8×</text><text class="s" x="290" y="110" text-anchor="end">GET $..price, 100,000 records</text><rect class="bar" x="300" y="97" height="20" width="514.6105263157895" rx="4"/><text class="m" x="820.6105263157895" y="111" text-anchor="start">8.73×</text><text class="s" x="290" y="140" text-anchor="end">SET $.items[*].price</text><rect class="bar" x="300" y="127" height="20" width="337.7684210526316" rx="4"/><text class="m" x="643.7684210526315" y="141" text-anchor="start">5.73×</text><text class="s" x="290" y="170" text-anchor="end">Filter over 100,000 records</text><rect class="bar" x="300" y="157" height="20" width="314.7789473684211" rx="4"/><text class="m" x="620.7789473684211" y="171" text-anchor="start">5.34×</text><text class="s" x="290" y="200" text-anchor="end">GET three paths</text><rect class="bar" x="300" y="187" height="20" width="242.86315789473687" rx="4"/><text class="m" x="548.8631578947369" y="201" text-anchor="start">4.12×</text><text class="s" x="290" y="230" text-anchor="end">GET $.address.city</text><rect class="bar" x="300" y="217" height="20" width="200.42105263157896" rx="4"/><text class="m" x="506.42105263157896" y="231" text-anchor="start">3.40×</text><text class="s" x="290" y="260" text-anchor="end">GET whole profile</text><rect class="bar" x="300" y="247" height="20" width="176.8421052631579" rx="4"/><text class="m" x="482.8421052631579" y="261" text-anchor="start">3.00×</text><text class="s" x="290" y="290" text-anchor="end">NUMINCRBY $.age 1</text><rect class="bar" x="300" y="277" height="20" width="155.62105263157895" rx="4"/><text class="m" x="461.62105263157895" y="291" text-anchor="start">2.64×</text><text class="s" x="290" y="320" text-anchor="end">SET whole order</text><rect class="bar" x="300" y="307" height="20" width="146.77894736842106" rx="4"/><text class="m" x="452.7789473684211" y="321" text-anchor="start">2.49×</text><text class="s" x="290" y="350" text-anchor="end">SET $.name (splice)</text><rect class="bar" x="300" y="337" height="20" width="107.28421052631579" rx="4"/><text class="m" x="413.2842105263158" y="351" text-anchor="start">1.82×</text><text class="s" x="290" y="380" text-anchor="end">GET 10,000 short strings</text><rect class="bar" x="300" y="367" height="20" width="72.50526315789473" rx="4"/><text class="m" x="378.5052631578947" y="381" text-anchor="start">1.23×</text><text class="s" x="290" y="410" text-anchor="end">GET 100,000 records whole</text><rect class="bar" x="300" y="397" height="20" width="64.25263157894737" rx="4"/><text class="m" x="370.2526315789474" y="411" text-anchor="start">1.09×</text><line class="ref" x1="358.9473684210526" y1="78" x2="358.9473684210526" y2="422"/><text class="refl" x="364.9473684210526" y="76" text-anchor="start">valkey-json</text><text class="s" x="24" y="468" text-anchor="start">With the final code, all 69 operations are faster: the median is 2.69× on Graviton and 2.30× on x86-64.</text><text class="s" x="24" y="486" text-anchor="start">Deleting a 100,000-record document no longer blocks the server for 28 ms. It is freed in the background.</text></svg>