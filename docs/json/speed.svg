<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 528" width="920" height="528" role="img" aria-label="Speed-up per operation over valkey-json">
<style>
  .bg{fill:#fcfcfb;stroke:#e4e3df}
  .t{fill:#0b0b0b;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}
  .h{fill:#0b0b0b;font:600 14px system-ui,-apple-system,Segoe UI,sans-serif}
  .s{fill:#52514e;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
  .m{fill:#0b0b0b;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .mw{fill:#ffffff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .cell{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
  .key{fill:#fde3d6;stroke:#eb6834;stroke-width:1}
  .hdr{fill:#e9e8e4;stroke:#8a8984;stroke-width:1}
  .word{fill:#2a78d6;stroke:#1c5cab;stroke-width:1}
  .box{fill:none;stroke:#c9c8c2;stroke-width:1;stroke-dasharray:4 3}
  .ln{stroke:#8a8984;stroke-width:1.5;fill:none}
  .kl{stroke:#eb6834;stroke-width:1.5;fill:none}
  .bar{fill:#2a78d6}
  .ref{stroke:#eb6834;stroke-width:2;stroke-dasharray:5 4}
  .refl{fill:#c2410c;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif}
  .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .xs{fill:#6b6a66;font:11px system-ui,-apple-system,Segoe UI,sans-serif}
  .n{fill:#0b0b0b;font:12px system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
  .ms{fill:#0b0b0b;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .br{stroke:#8a8984;stroke-width:1;fill:none}
  .grid{stroke:#e4e3df;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:#383835}
    .t,.h,.m{fill:#f0efec}
    .s{fill:#c3c2b7}
    .cell{fill:#184f95;stroke:#6da7ec}
    .key{fill:#6b2a12;stroke:#d95926}
    .hdr{fill:#383835;stroke:#8a8984}
    .word{fill:#3987e5;stroke:#86b6ef}
    .box{stroke:#52514e}
    .ln{stroke:#a3a29b}
    .bar{fill:#3987e5}
    .ref{stroke:#d95926}
    .refl{fill:#f4a37f}
    .hi{fill:none;stroke:#eb6834;stroke-width:2}
  .xs{fill:#6b6a66;font:11px system-ui,-apple-system,Segoe UI,sans-serif}
  .n{fill:#0b0b0b;font:12px system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
  .ms{fill:#0b0b0b;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .br{stroke:#8a8984;stroke-width:1;fill:none}
  .grid{stroke:#383835}
    .xs{fill:#a3a29b}
    .n,.ms{fill:#f0efec}
    .br{stroke:#a3a29b}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="919" height="527" rx="10"/><text class="t" x="24" y="34" text-anchor="start">Speed-up over valkey-json</text><text class="s" x="24" y="56" text-anchor="start">Higher is better. Server time per call for 11 of the 69 operations, final Graviton3 run.</text><line class="grid" x1="300.0" y1="84" x2="300.0" y2="422"/><text class="xs" x="300.0" y="438" text-anchor="middle">0×</text><line class="grid" x1="417.89473684210526" y1="84" x2="417.89473684210526" y2="422"/><text class="xs" x="417.89473684210526" y="438" text-anchor="middle">2×</text><line class="grid" x1="535.7894736842105" y1="84" x2="535.7894736842105" y2="422"/><text class="xs" x="535.7894736842105" y="438" text-anchor="middle">4×</text><line class="grid" x1="653.6842105263158" y1="84" x2="653.6842105263158" y2="422"/><text class="xs" x="653.6842105263158" y="438" text-anchor="middle">6×</text><line class="grid" x1="771.578947368421" y1="84" x2="771.578947368421" y2="422"/><text class="xs" x="771.578947368421" y="438" text-anchor="middle">8×</text><text class="s" x="290" y="111" text-anchor="end">GET $..price, 100,000 records</text><rect class="bar" x="300" y="97" height="20" width="485.13684210526316" rx="4"/><text class="n" x="791.1368421052632" y="111" text-anchor="start">8.23×</text><text class="s" x="290" y="141" text-anchor="end">SET $.items[*].price</text><rect class="bar" x="300" y="127" height="20" width="346.021052631579" rx="4"/><text class="n" x="652.021052631579" y="141" text-anchor="start">5.87×</text><text class="s" x="290" y="171" text-anchor="end">Filter over 100,000 records</text><rect class="bar" x="300" y="157" height="20" width="314.18947368421055" rx="4"/><text class="n" x="620.1894736842105" y="171" text-anchor="start">5.33×</text><text class="s" x="290" y="201" text-anchor="end">GET three paths</text><rect class="bar" x="300" y="187" height="20" width="262.3157894736842" rx="4"/><text class="n" x="568.3157894736842" y="201" text-anchor="start">4.45×</text><text class="s" x="290" y="231" text-anchor="end">GET $.address.city</text><rect class="bar" x="300" y="217" height="20" width="232.8421052631579" rx="4"/><text class="n" x="538.8421052631579" y="231" text-anchor="start">3.95×</text><text class="s" x="290" y="261" text-anchor="end">GET whole profile</text><rect class="bar" x="300" y="247" height="20" width="190.98947368421054" rx="4"/><text class="n" x="496.98947368421057" y="261" text-anchor="start">3.24×</text><text class="s" x="290" y="291" text-anchor="end">NUMINCRBY $.age 1</text><rect class="bar" x="300" y="277" height="20" width="178.02105263157895" rx="4"/><text class="n" x="484.021052631579" y="291" text-anchor="start">3.02×</text><text class="s" x="290" y="321" text-anchor="end">SET whole order</text><rect class="bar" x="300" y="307" height="20" width="156.8" rx="4"/><text class="n" x="462.8" y="321" text-anchor="start">2.66×</text><text class="s" x="290" y="351" text-anchor="end">SET $.name (splice)</text><rect class="bar" x="300" y="337" height="20" width="117.89473684210526" rx="4"/><text class="n" x="423.89473684210526" y="351" text-anchor="start">2.00×</text><text class="s" x="290" y="381" text-anchor="end">GET 100,000 records whole</text><rect class="bar" x="300" y="367" height="20" width="74.27368421052631" rx="4"/><text class="n" x="380.2736842105263" y="381" text-anchor="start">1.26×</text><text class="s" x="290" y="411" text-anchor="end">GET 10,000 short strings</text><rect class="bar" x="300" y="397" height="20" width="71.9157894736842" rx="4"/><text class="n" x="377.9157894736842" y="411" text-anchor="start">1.22×</text><line class="ref" x1="358.9473684210526" y1="78" x2="358.9473684210526" y2="422"/><text class="refl" x="364.9473684210526" y="76" text-anchor="start">valkey-json = 1×</text><text class="s" x="24" y="468" text-anchor="start">All 69 operations are faster: the median is 2.69× on Graviton and 2.30× on x86-64.</text><text class="s" x="24" y="486" text-anchor="start">Deleting a 100,000-record document no longer blocks the server for 28 ms. It is freed in the background.</text></svg>