name: 'Install TCL8'
description: 'Installs tcl8 and tcltls from source on Fedora-based or uses the system package on others.'

inputs:
  matrix_name:
    description: 'The name of the matrix to check for fedora'
    required: true

runs:
  using: "composite"
  steps:
    # Fedora 42+ comes with Tcl 9 by default, while the test harness uses Tcl 8.
    # Build TclTLS against Tcl 8 explicitly so package loading uses the Tcl 8 ABI.
    # TclTLS 1.7.22 no longer builds on Fedora Rawhide because it dereferences
    # OpenSSL ASN.1 structs that are opaque in newer OpenSSL headers.
    - run: |
        if [[ "${{ inputs.matrix_name }}" =~ "fedora" ]]; then
          TCLTLS_VERSION=2.0.1
          dnf -y install tcl8 tcl8-devel gcc make awk openssl openssl-devel
          ln -s /usr/bin/tclsh8.6 /usr/bin/tclsh
          curl -fL -o "tcltls-${TCLTLS_VERSION}.tar.gz" "https://core.tcl-lang.org/tcltls/tarball/tcltls-${TCLTLS_VERSION}.tar.gz?r=tls-${TCLTLS_VERSION}"
          tar -xzf "tcltls-${TCLTLS_VERSION}.tar.gz"
          pushd "tcltls-${TCLTLS_VERSION}"
          ./configure --with-tcl=/usr/lib64/tcl8.6 --prefix=/usr --libdir=/usr/lib64/tcl8.6
          make
          make install
          popd
        else
            dnf -y install tcl tcltls
        fi
        ./utils/gen-test-certs.sh
      shell: bash
