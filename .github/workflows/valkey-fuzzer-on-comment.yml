name: On-Demand Valkey Fuzzer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  gate:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    outputs:
      is_command: ${{ steps.evaluate.outputs.is_command }}
      is_authorized: ${{ steps.evaluate.outputs.is_authorized }}
      should_run: ${{ steps.evaluate.outputs.should_run }}
      merge_ref: ${{ steps.evaluate.outputs.merge_ref }}
    steps:
      - name: Evaluate comment command
        id: evaluate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          command = os.environ["COMMENT_BODY"].strip()
          issue_number = os.environ["ISSUE_NUMBER"]
          allowed_associations = {"OWNER", "MEMBER", "COLLABORATOR"}
          is_command = command.startswith("/valkey-fuzzer run")
          is_authorized = os.environ["AUTHOR_ASSOCIATION"] in allowed_associations
          should_run = is_command and is_authorized

          print(f"is_command={'true' if is_command else 'false'}")
          print(f"is_authorized={'true' if is_authorized else 'false'}")
          print(f"should_run={'true' if should_run else 'false'}")
          print(f"merge_ref=refs/pull/{issue_number}/merge")
          PY

  unauthorized:
    needs: gate
    if: ${{ needs.gate.outputs.is_command == 'true' && needs.gate.outputs.is_authorized != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reply to unauthorized trigger
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Only repository maintainers and collaborators can run `/valkey-fuzzer run`."
            });

  acknowledge:
    needs: gate
    if: ${{ needs.gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge queued fuzzer run
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Queued Valkey fuzzer run for \`${{ needs.gate.outputs.merge_ref }}\`.`,
                "",
                `Workflow run: ${runUrl}`
              ].join("\n")
            });

  fuzzer:
    needs:
      - gate
      - acknowledge
    if: ${{ needs.gate.outputs.should_run == 'true' }}
    # Switch both the repository and SHA to valkey-io/valkey-fuzzer once the upstream
    # reusable workflow changes are merged there.
    uses: sarthakaggarwal97/valkey-fuzzer/.github/workflows/valkey-pr-fuzzer.yml@bcbd010e594be5d8299ae916cbb10b3818142bfe
    with:
      fuzzer_repository: sarthakaggarwal97/valkey-fuzzer
      fuzzer_ref: bcbd010e594be5d8299ae916cbb10b3818142bfe
      valkey_repository: ${{ github.repository }}
      valkey_ref: ${{ needs.gate.outputs.merge_ref }}
      pr_number: ${{ github.event.issue.number }}
      pr_url: ${{ github.event.issue.html_url }}
      label_name: /valkey-fuzzer run
      run_count: 10
