name: Targeted Almalinux8 TLS Module Loop

on:
  push:
    branches:
      - daily-repl-rdb-child-timeout-20260414-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  almalinux8-tls-module-loop:
    name: almalinux8 tls-module loop (${{ matrix.subcase }})
    runs-on: ubuntu-latest
    container: almalinux:8
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        subcase: [all, slow, fast, no, timeout]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install EPEL
        run: dnf -y install epel-release

      - name: Install libbacktrace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ianlancetaylor/libbacktrace
          ref: b9e40069c0b47a722286b94eb5231f7f05c08713
          path: libbacktrace

      - name: Build dependencies
        run: |
          dnf -y install make gcc openssl-devel openssl procps-ng which /usr/bin/kill /usr/bin/awk tcl tcltls
          cd libbacktrace && ./configure && make && make install

      - name: Build valkey
        run: make -j BUILD_TLS=module SERVER_CFLAGS='-Werror' USE_LIBBACKTRACE=yes

      - name: Generate test certs
        run: ./utils/gen-test-certs.sh

      - name: Run targeted loop
        run: |
          ./runtest \
            --verbose \
            --dump-logs \
            --tls-module \
            --clients 1 \
            --single tests/integration/replication-diskless-all-only.tcl \
            --only "diskless ${{ matrix.subcase }} replicas drop during rdb pipe" \
            --loops 100
