# Fork-only E2E entry point for the streamlined release flow.
#
# This workflow forwards the acting human and release decision to the copied
# valkey-ci-agent branch. The controller performs the authoritative live
# authorization and release derivation before creating any public artifact.
name: Start Release
run-name: "Start Release on ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release line, e.g. 9.1"
        required: true
        type: string
      intent:
        description: "Release kind"
        required: true
        type: choice
        options: [rc, ga, patch]
      urgency:
        description: "Upgrade urgency"
        required: true
        type: choice
        options: [LOW, MODERATE, HIGH, CRITICAL, SECURITY]
      dry_run:
        description: "Preview without opening a tracker or release-notes PR"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  relay:
    name: Relay to copied release controller
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch Prepare Release
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          TARGET: sarthakaggarwal97/valkey-ci-agent
          BRANCH: ${{ inputs.branch }}
          INTENT: ${{ inputs.intent }}
          URGENCY: ${{ inputs.urgency }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          ACTOR: ${{ github.triggering_actor }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || {
            echo "::error::AUTOMATION_PAT is required for the fork E2E relay."
            exit 1
          }
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg branch "$BRANCH" \
            --arg intent "$INTENT" \
            --arg urgency "$URGENCY" \
            --arg actor "$ACTOR" \
            --argjson dry_run "$DRY_RUN" \
            --arg source_run "$SOURCE_RUN" \
            '{event_type: "release-prepare",
              client_payload: {branch: $branch, intent: $intent,
                               urgency: $urgency, actor: $actor,
                               dry_run: $dry_run, source_run: $source_run}}' \
          | gh api "repos/${TARGET}/dispatches" --input -
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"
          echo "Relayed branch=$BRANCH intent=$INTENT actor=$ACTOR" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm controller pickup
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          TARGET: sarthakaggarwal97/valkey-ci-agent
          SINCE: ${{ steps.dispatch.outputs.dispatched_at }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          found=""
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            found=$(gh run list --repo "$TARGET" --workflow release-prepare.yml --limit 20 \
              --json createdAt,displayTitle,url \
              | jq -r --arg since "$SINCE" --arg title "Prepare" --arg branch "$BRANCH" \
                  '[.[] | select(.createdAt >= $since)
                        | select(.displayTitle | contains($title) and contains($branch))]
                   | first | .url // empty') || found=""
            [[ -n "$found" ]] && break
          done
          [[ -n "$found" ]] || {
            echo "::error::Copied controller did not pick up the dispatch within 60 seconds."
            exit 1
          }
          echo "Controller run: $found" >> "$GITHUB_STEP_SUMMARY"
