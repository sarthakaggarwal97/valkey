name: Start Release
run-name: "Start Release on ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch, for example 9.1"
        required: true
        type: string
      intent:
        description: "Release intent"
        required: true
        type: choice
        options: [rc, ga, patch]
      urgency:
        description: "Release-note urgency"
        required: true
        type: choice
        options: [LOW, MODERATE, HIGH, CRITICAL, SECURITY]

permissions: {}

jobs:
  relay:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-start
    permissions:
      contents: read
    steps:
      - name: Mint relay-only token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-ci-agent
          permission-contents: write
          permission-metadata: read
      - name: Relay trusted source-run receipt
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ github.repository_owner }}/valkey-ci-agent
          SOURCE_RUN: ${{ github.run_id }}
          BRANCH: ${{ inputs.branch }}
          INTENT: ${{ inputs.intent }}
          URGENCY: ${{ inputs.urgency }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_run "$SOURCE_RUN" \
            --arg branch "$BRANCH" \
            --arg intent "$INTENT" \
            --arg urgency "$URGENCY" \
            '{event_type:"release-start",client_payload:{
              source_run:$source_run,branch:$branch,
              intent:$intent,urgency:$urgency}}' |
            gh api "repos/$TARGET/dispatches" --input -
