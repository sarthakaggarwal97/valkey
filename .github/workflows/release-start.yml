name: Start Release
run-name: "Start ${{ inputs.intent }} release on ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release line, e.g. 9.1"
        required: true
        type: string
      intent:
        description: Release kind
        required: true
        type: choice
        options: [rc, ga, patch]
      urgency:
        description: Upgrade urgency
        required: true
        type: choice
        options: [LOW, MODERATE, HIGH, CRITICAL, SECURITY]
      dry_run:
        description: Derive and display only; do not open a PR
        required: false
        type: boolean
        default: false
      target_version:
        description: Fork-only exact patch target for one intentionally skipped unpublished version
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-start-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  start:
    name: Hand off to the release controller
    if: github.repository == 'sarthakaggarwal97/valkey' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork-only E2E: the temporary repository PAT is available only as a
    # repository secret and is deleted after the release relay completes.
    steps:
      - name: Validate inputs
        env:
          BRANCH: ${{ inputs.branch }}
          INTENT: ${{ inputs.intent }}
          TARGET_VERSION: ${{ inputs.target_version }}
          INITIATOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "branch must be MAJOR.MINOR" >&2; exit 1; }
          if [[ -n "$TARGET_VERSION" ]]; then
            [[ "$INTENT" == "patch" ]] || { echo "target_version requires patch intent" >&2; exit 1; }
            [[ "$TARGET_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "target_version must be exact unpadded MAJOR.MINOR.PATCH" >&2
              exit 1
            }
            [[ "$TARGET_VERSION" == "$BRANCH".* ]] || {
              echo "target_version must belong to branch $BRANCH" >&2
              exit 1
            }
          fi
          [[ "$INITIATOR" =~ ^[A-Za-z0-9-]{1,39}$ ]] || { echo "invalid initiator login" >&2; exit 1; }

      - name: Start controller workflow
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          BRANCH: ${{ inputs.branch }}
          INTENT: ${{ inputs.intent }}
          URGENCY: ${{ inputs.urgency }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_VERSION: ${{ inputs.target_version }}
          INITIATOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "AUTOMATION_PAT is required for fork E2E" >&2; exit 1; }
          args=(
            --repo sarthakaggarwal97/valkey-ci-agent
            --ref e2e/latest-9.1.4-release-controller
            -f branch="$BRANCH"
            -f intent="$INTENT"
            -f urgency="$URGENCY"
            -f dry_run="$DRY_RUN"
            -f initiator="$INITIATOR"
          )
          if [[ -n "$TARGET_VERSION" ]]; then
            args+=(-f target_version="$TARGET_VERSION")
          fi
          gh workflow run release-prepare.yml "${args[@]}"

          {
            echo "## Release preparation started"
            echo
            echo "The controller will derive the exact release, open the notes PR, and create the maintainer dashboard."
            echo
            echo "[Open release controller runs](https://github.com/sarthakaggarwal97/valkey-ci-agent/actions/workflows/release-prepare.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
