name: Targeted Almalinux8 No-TLS Harness

on:
  push:
    branches:
      - codex/daily-hooks-ci
  workflow_dispatch:
    inputs:
      use_repo:
        description: "Repository owner/name to checkout"
        default: "valkey-io/valkey"
        required: true
      use_git_ref:
        description: "Branch or SHA to checkout"
        default: "unstable"
        required: true
      run_valkey_tests:
        description: "Run ./runtest before module API tests (true/false)"
        default: "true"
        required: true
      valkey_test_args:
        description: "Extra args for ./runtest"
        default: ""
        required: false
      run_moduleapi_tests:
        description: "Run ./runtest-moduleapi (true/false)"
        default: "true"
        required: true
      moduleapi_test_args:
        description: "Extra args for ./runtest-moduleapi"
        default: ""
        required: false
      moduleapi_loops:
        description: "Repeat count for module API tests"
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  almalinux8-no-tls:
    name: almalinux8 no-tls harness
    runs-on: ubuntu-latest
    container: almalinux:8
    timeout-minutes: 1440
    env:
      USE_REPO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_repo || github.repository }}
      USE_GIT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_git_ref || github.sha }}
      RUN_VALKEY_TESTS: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_valkey_tests != 'false' }}
      VALKEY_TEST_ARGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.valkey_test_args || '' }}
      RUN_MODULEAPI_TESTS: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_moduleapi_tests != 'false' }}
      MODULEAPI_TEST_ARGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.moduleapi_test_args || '' }}
      MODULEAPI_LOOPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.moduleapi_loops || '1' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.USE_REPO }}
          ref: ${{ env.USE_GIT_REF }}

      - name: Install EPEL
        run: dnf -y install epel-release

      - name: Install libbacktrace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ianlancetaylor/libbacktrace
          ref: b9e40069c0b47a722286b94eb5231f7f05c08713
          path: libbacktrace

      - name: Build dependencies
        run: |
          dnf -y install make gcc openssl-devel openssl procps-ng which /usr/bin/kill /usr/bin/awk tcl tcltls
          cd libbacktrace && ./configure && make && make install

      - name: Build valkey
        run: make -j BUILD_TLS=module SERVER_CFLAGS='-Werror' USE_LIBBACKTRACE=yes

      - name: Generate test certs
        run: ./utils/gen-test-certs.sh

      - name: Run valkey tests
        if: ${{ env.RUN_VALKEY_TESTS == 'true' }}
        run: |
          ./runtest --accurate --verbose --dump-logs $VALKEY_TEST_ARGS

      - name: Run module API tests
        if: ${{ env.RUN_MODULEAPI_TESTS == 'true' }}
        run: |
          extra_args="$MODULEAPI_TEST_ARGS"
          if [ "$MODULEAPI_LOOPS" != "1" ]; then
            extra_args="$extra_args --loops $MODULEAPI_LOOPS"
          fi
          CFLAGS='-Werror' ./runtest-moduleapi --verbose --dump-logs $extra_args
