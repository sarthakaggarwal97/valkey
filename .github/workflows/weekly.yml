name: Weekly Test Workflow for Released Branches
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: weekly-release-tests
  cancel-in-progress: false
jobs:
  determine-release-branches:
    # TEST BRANCH: removed 'valkey-io/valkey' guard so this can run on a fork.
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.release-branches.outputs.branches }}
      has-branches: ${{ steps.release-branches.outputs.has-branches }}
    steps:
      - name: Collect release branches
        id: release-branches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const MIN_MAJOR = 7;
            const MIN_MINOR = 2;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const releaseBranches = branches
              .map(({ name }) => name)
              .filter(name => /^\d+\.\d+$/.test(name))
              .filter(name => {
                const [major, minor] = name.split('.').map(Number);
                return Number.isInteger(major) &&
                  Number.isInteger(minor) &&
                  (major > MIN_MAJOR || (major === MIN_MAJOR && minor >= MIN_MINOR));
              })
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            core.info(`Weekly release branches: ${releaseBranches.join(', ') || '(none)'}`);
            core.setOutput('branches', JSON.stringify(releaseBranches));
            core.setOutput('has-branches', releaseBranches.length > 0 ? 'true' : 'false');
  run-daily-for-release-branches:
    needs: determine-release-branches
    # TEST BRANCH: removed 'valkey-io/valkey' guard so this can run on a fork.
    if: needs.determine-release-branches.outputs.has-branches == 'true'
    permissions:
      actions: write
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        # TEST BRANCH: narrow matrix to a single release branch to keep CI cheap.
        release-branch: ["9.0"]
      max-parallel: 1
    uses: ./.github/workflows/daily.yml
    with:
      # TEST BRANCH: point at the fork so daily.yml checkouts hit a repo we own.
      use_repo: sarthakaggarwal97/valkey
      use_git_ref: ${{ matrix.release-branch }}
      # TEST BRANCH: skip every job and every test so we only validate that
      # the reusable workflow chain starts (permissions + inputs are valid).
      skipjobs: "valgrind,sanitizer,tls,freebsd,macos,alpine,32bit,iothreads,ubuntu,rpm-distros,malloc,specific,fortify,reply-schema,arm,s390x,lttng"
      skiptests: "valkey,modules,sentinel,cluster,unittest,large-memory"
    secrets: inherit
